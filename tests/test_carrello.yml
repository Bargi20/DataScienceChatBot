version: "3.1"

stories:

- story: test carrello aggiungi e mostra
  steps:
  - user: |
      aggiungi 2 [Catan](gioco) al carrello
    intent: aggiungi_carrello
  - action: action_aggiungi_carrello
  - user: |
      fammi vedere il carrello
    intent: mostra_carrello
  - action: action_mostra_carrello

- story: test carrello codice sconto e checkout
  steps:
  - user: |
      metti nel carrello [Catan](gioco)
    intent: aggiungi_carrello
  - action: action_aggiungi_carrello
  - user: |
      ho il codice [GIOCA5](codice_sconto)
    intent: applica_codice_sconto
  - action: action_applica_codice_sconto
  - user: |
      voglio pagare
    intent: vai_checkout
  - action: action_vai_checkout

- story: test carrello svuota con conferma
  steps:
  - user: |
      svuota il carrello
    intent: svuota_carrello
  - action: action_chiedi_svuota_carrello
  - slot_was_set:
    - carrello_conferma_svuota: true
  - user: |
      sì
    intent: affirm
  - action: action_svuota_carrello
  - slot_was_set:
    - carrello_conferma_svuota: false

- story: test carrello svuota ma rifiuta
  steps:
  - user: |
      cancella tutto il carrello
    intent: svuota_carrello
  - action: action_chiedi_svuota_carrello
  - slot_was_set:
    - carrello_conferma_svuota: true
  - user: |
      no
    intent: deny
  - action: action_annulla_svuota_carrello
  - slot_was_set:
    - carrello_conferma_svuota: false

- story: test carrello cambia quantità e togli
  steps:
  - user: |
      cambia la quantità di [Catan](gioco) a [3](quantita)
    intent: cambia_quantita_carrello
  - action: action_cambia_quantita_carrello
  - user: |
      togli [Catan](gioco) dal carrello
    intent: togli_carrello
  - action: action_togli_carrello

- story: test carrello faq ordine minimo
  steps:
  - user: |
      c'è un ordine minimo?
    intent: faq_carrello
  - action: utter_faq_carrello
