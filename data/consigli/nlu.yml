version: "3.1"

# Area consigli.
# Entità nuova: «occasione», con i valori coppia (partner: ragazza, marito…), principianti, esperti.
# Le occasioni che sono anche categorie del catalogo (per due, solitario, famiglia, bambini, party)
# restano annotate come «categoria»: action_consiglia_occasione le traduce nell'occasione.

