version: "3.1"

# Domande frequenti fatte a metà di un form: il bot risponde e poi ripete la domanda del form.
# Funziona perché tutti i form elencano gli intent faq_* in ignored_intents (domain.yml):
# il form non prende la domanda come risposta, si ferma e lascia il turno a queste regole.
# Per uscire da un form c'è l'intent «interrompi», con le regole nei file delle aree.

rules:

# --- consiglio personalizzato (consiglio_form) ---

- rule: faq_giochi durante consiglio_form
  condition:
  - active_loop: consiglio_form
  steps:
  - intent: faq_giochi
  - action: utter_faq_giochi
  - action: consiglio_form
  - active_loop: consiglio_form

- rule: faq_carrello durante consiglio_form
  condition:
  - active_loop: consiglio_form
  steps:
  - intent: faq_carrello
  - action: utter_faq_carrello
  - action: consiglio_form
  - active_loop: consiglio_form

- rule: faq_ordini durante consiglio_form
  condition:
  - active_loop: consiglio_form
  steps:
  - intent: faq_ordini
  - action: utter_faq_ordini
  - action: consiglio_form
  - active_loop: consiglio_form

- rule: faq_spedizioni durante consiglio_form
  condition:
  - active_loop: consiglio_form
  steps:
  - intent: faq_spedizioni
  - action: utter_faq_spedizioni
  - action: consiglio_form
  - active_loop: consiglio_form

- rule: faq_pagamenti durante consiglio_form
  condition:
  - active_loop: consiglio_form
  steps:
  - intent: faq_pagamenti
  - action: utter_faq_pagamenti
  - action: consiglio_form
  - active_loop: consiglio_form

- rule: faq_resi durante consiglio_form
  condition:
  - active_loop: consiglio_form
  steps:
  - intent: faq_resi
  - action: utter_faq_resi
  - action: consiglio_form
  - active_loop: consiglio_form

- rule: faq_account durante consiglio_form
  condition:
  - active_loop: consiglio_form
  steps:
  - intent: faq_account
  - action: utter_faq_account
  - action: consiglio_form
  - active_loop: consiglio_form

- rule: faq_negozio durante consiglio_form
  condition:
  - active_loop: consiglio_form
  steps:
  - intent: faq_negozio
  - action: utter_faq_negozio
  - action: consiglio_form
  - active_loop: consiglio_form

